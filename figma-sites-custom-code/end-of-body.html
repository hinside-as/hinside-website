<script>
  (function () {
    const STATE_KEY = "__hinsideBlinkCursorState";

    if (window[STATE_KEY] && typeof window[STATE_KEY].cleanup === "function") {
      window[STATE_KEY].cleanup();
    }

    const EYE_OPEN_CURSOR_DATA_URI = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="96" height="56" viewBox="0 0 96 56" fill="none">
        <path d="M64 48V56H32V48H64Z" fill="white"/>
        <path d="M32 48H16V40H32V48Z" fill="white"/>
        <path d="M80 48H64V40H80V48Z" fill="white"/>
        <path d="M16 40H8V32H16V40Z" fill="white"/>
        <path d="M88 40H80V32H88V40Z" fill="white"/>
        <path d="M56 36H40V20H56V36Z" fill="white"/>
        <path d="M8 32H0V24H8V32Z" fill="white"/>
        <path d="M96 32H88V24H96V32Z" fill="white"/>
        <path d="M16 24H8V16H16V24Z" fill="white"/>
        <path d="M88 24H80V16H88V24Z" fill="white"/>
        <path d="M32 16H16V8H32V16Z" fill="white"/>
        <path d="M80 16H64V8H80V16Z" fill="white"/>
        <path d="M64 8H32V0H64V8Z" fill="white"/>
      </svg>
    `)}`;
    const EYE_HALF_CURSOR_DATA_URI = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="96" height="24" viewBox="0 0 96 24" fill="none">
        <path d="M80 8H56V16H80V24H16V16H40V8H16V0H80V8Z" fill="white"/>
        <path d="M16 16H0V8H16V16Z" fill="white"/>
        <path d="M96 8V16H80V8H96Z" fill="white"/>
      </svg>
    `)}`;
    const EYE_CLOSED_CURSOR_DATA_URI = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="96" height="8" viewBox="0 0 96 8" fill="none">
        <path d="M96 0V8H0V0H96Z" fill="white"/>
      </svg>
    `)}`;

    const OPEN_CURSOR = `url("${EYE_OPEN_CURSOR_DATA_URI}") 48 28`;
    const HALF_CURSOR = `url("${EYE_HALF_CURSOR_DATA_URI}") 48 12`;
    const CLOSED_CURSOR = `url("${EYE_CLOSED_CURSOR_DATA_URI}") 48 4`;
    const CURSOR_FRAMES = [OPEN_CURSOR, HALF_CURSOR, CLOSED_CURSOR];

    const BLINK_SEQUENCE_SINGLE = [0, 1, 2, 1, 0];
    const BLINK_SEQUENCE_DOUBLE = [0, 1, 2, 1, 0, 1, 2, 1, 0];
    const BLINK_TIMINGS_MS = [0, 120, 185, 250, 330, 410, 475, 540, 620];
    const BLINK_DOUBLE_PROBABILITY = 0.32;
    const BLINK_NEXT_DELAY_MIN_MS = 2600;
    const BLINK_NEXT_DELAY_RANGE_MS = 2800;

    let style = document.getElementById("hinside-eye-cursor-style");
    if (!style) {
      style = document.createElement("style");
      style.id = "hinside-eye-cursor-style";
      document.head.appendChild(style);
    }

    style.textContent = `
      @media (pointer: fine) and (hover: hover) {
        /*
          Disable Figma Sites' fake cursor overlay, if it exists.
          We are using the browser's native cursor system instead.
        */
        #sites-cursor-element {
          display: none !important;
          visibility: hidden !important;
        }

        /*
          Target clickable image wrappers generated by Figma Sites.
          Hotspot is centered: 96 / 2 = 48, 56 / 2 = 28.
        */
        .hinside-eye-cursor-target,
        .hinside-eye-cursor-target * {
          cursor: var(--hinside-eye-cursor), pointer !important;
        }
      }
    `;

    function setCursor(cursorValue) {
      document.documentElement.style.setProperty("--hinside-eye-cursor", cursorValue);
    }

    const timers = [];

    function queue(fn, delayMs) {
      const id = window.setTimeout(fn, delayMs);
      timers.push(id);
      return id;
    }

    function clearTimers() {
      while (timers.length) {
        window.clearTimeout(timers.pop());
      }
    }

    function isMediaLightboxTarget(element) {
      if (!element || typeof element.querySelector !== "function") {
        return false;
      }

      return !!element.querySelector("img, picture, figure");
    }

    function bindCursorTargets() {
      const candidates = document.querySelectorAll(
        ".code-behavior-wrapper [role='button'], .code-behavior-wrapper .cursor-pointer"
      );

      candidates.forEach(function (candidate) {
        if (isMediaLightboxTarget(candidate)) {
          candidate.classList.add("hinside-eye-cursor-target");
        } else {
          candidate.classList.remove("hinside-eye-cursor-target");
        }
      });
    }

    function applyFrame(frameIndex) {
      const frame = CURSOR_FRAMES[frameIndex] || CURSOR_FRAMES[0];
      setCursor(frame);
    }

    function scheduleBlink() {
      clearTimers();
      const sequence = Math.random() < BLINK_DOUBLE_PROBABILITY
        ? BLINK_SEQUENCE_DOUBLE
        : BLINK_SEQUENCE_SINGLE;

      function step(index) {
        applyFrame(sequence[index]);

        if (index < sequence.length - 1) {
          const delayMs = BLINK_TIMINGS_MS[index + 1] - BLINK_TIMINGS_MS[index];
          queue(function () {
            step(index + 1);
          }, delayMs);
          return;
        }

        const nextBlinkDelay = BLINK_NEXT_DELAY_MIN_MS + Math.random() * BLINK_NEXT_DELAY_RANGE_MS;
        queue(function () {
          scheduleBlink();
        }, nextBlinkDelay);
      }

      step(0);
    }

    setCursor(OPEN_CURSOR);
    bindCursorTargets();
    scheduleBlink();

    let bindAttempts = 0;
    const bindInterval = window.setInterval(function () {
      bindAttempts += 1;
      bindCursorTargets();
      if (bindAttempts >= 40) {
        window.clearInterval(bindInterval);
      }
    }, 250);

    window[STATE_KEY] = {
      cleanup: function () {
        clearTimers();
        window.clearInterval(bindInterval);
        setCursor(OPEN_CURSOR);
      }
    };
  })();
</script>

<script>
  (function () {
    var STATE_KEY = "__hinsideTextLinkState";
    var LEGACY_STATE_KEYS = ["__hinsideAnchorMenuState"];
    var STYLE_ID = "hinside-link-text-style";
    var ACTIVE_CLASS = "hinside-link-active";
    var OPACITY_IDLE = "1";
    var OPACITY_ACTIVE = "0.8";
    var TRANSITION_DURATION = "150ms";
    var TRANSITION_EASING = "ease-out";
    var BASE_FONT_PT = 14;
    var BASE_UNDERLINE_PX = 0.5;
    var UNDERLINE_OFFSET = "0.08em";
    var INTERACTIVE_SELECTOR = [
      "a[href]",
      "button",
      "[role='button']",
      ".cursor-pointer"
    ].join(",");

    if (window[STATE_KEY] && typeof window[STATE_KEY].cleanup === "function") {
      window[STATE_KEY].cleanup();
    }

    LEGACY_STATE_KEYS.forEach(function (key) {
      if (window[key] && typeof window[key].cleanup === "function") {
        window[key].cleanup();
      }
    });

    function ensureStyle() {
      var style = document.getElementById(STYLE_ID);
      if (!style) {
        style = document.createElement("style");
        style.id = STYLE_ID;
        document.head.appendChild(style);
      }

      style.textContent = [
        INTERACTIVE_SELECTOR + " {",
        "  cursor: pointer;",
        "}",
        "@media (prefers-reduced-motion: reduce) {",
        "  " + INTERACTIVE_SELECTOR + " {",
        "    transition-duration: 100ms !important;",
        "    transition-timing-function: linear !important;",
        "  }",
        "}"
      ].join("\\n");
    }

    function normalizeNode(node) {
      if (!node) return null;
      return node.nodeType === 3 ? node.parentElement : node;
    }

    function getInteractiveFromNode(node) {
      node = normalizeNode(node);
      if (!node || typeof node.closest !== "function") return null;

      var interactive = node.closest(INTERACTIVE_SELECTOR);
      if (!interactive) return null;
      if (interactive.hasAttribute("data-no-link-style")) return null;
      if (!(interactive.textContent || "").trim()) return null;
      return interactive;
    }

    function getTextTarget(interactive) {
      if (!interactive || typeof interactive.querySelector !== "function") {
        return null;
      }

      var direct = interactive.querySelector(":scope > p, :scope > span, :scope > a, :scope > label");
      if (direct) return direct;

      var nested = interactive.querySelector("p, span, a, label");
      if (nested) return nested;

      return interactive;
    }

    function paintInteractive(interactive, isActive) {
      var target = getTextTarget(interactive);
      if (!target || !target.style) return;
      trackTarget(target);

      var computedFontPx = parseFloat(window.getComputedStyle(target).fontSize || "0") || 0;
      var baseFontPx = BASE_FONT_PT * (96 / 72);
      var underlinePx = baseFontPx > 0
        ? (computedFontPx / baseFontPx) * BASE_UNDERLINE_PX
        : BASE_UNDERLINE_PX;
      var underlineThickness = underlinePx.toFixed(3).replace(/\.0+$/, "").replace(/(\.\d*?)0+$/, "$1") + "px";

      target.style.textDecoration = "none";
      target.style.backgroundImage = "linear-gradient(currentColor, currentColor)";
      target.style.backgroundRepeat = "no-repeat";
      target.style.backgroundPosition = "0 calc(100% - " + UNDERLINE_OFFSET + ")";
      target.style.backgroundSize =
        (isActive ? "100%" : "0%") + " " + underlineThickness;
      target.style.opacity = isActive ? OPACITY_ACTIVE : OPACITY_IDLE;
      target.style.transitionProperty = "opacity, background-size";
      target.style.transitionDuration = TRANSITION_DURATION;
      target.style.transitionTimingFunction = TRANSITION_EASING;
    }

    var activeInteractive = null;
    var touchedTargets = [];
    var activateRafId = 0;

    function trackTarget(target) {
      if (!target) return;
      if (touchedTargets.indexOf(target) >= 0) return;
      touchedTargets.push(target);
    }

    function clearActive() {
      if (activateRafId) {
        window.cancelAnimationFrame(activateRafId);
        activateRafId = 0;
      }

      if (!activeInteractive) return;
      paintInteractive(activeInteractive, false);
      activeInteractive.classList.remove(ACTIVE_CLASS);
      activeInteractive = null;
    }

    function setActiveInteractive(interactive) {
      if (!interactive) return;
      if (activeInteractive === interactive) return;
      clearActive();

      // Prime baseline state first, then animate to active on next frame.
      paintInteractive(interactive, false);
      activeInteractive = interactive;

      activateRafId = window.requestAnimationFrame(function () {
        if (activeInteractive !== interactive) return;
        paintInteractive(interactive, true);
        interactive.classList.add(ACTIVE_CLASS);
        activateRafId = 0;
      });
    }

    function onMouseOver(event) {
      var interactive = getInteractiveFromNode(event.target);
      if (interactive) setActiveInteractive(interactive);
    }

    function onMouseOut(event) {
      if (!activeInteractive) return;
      var next = event.relatedTarget;
      if (next && activeInteractive.contains(next)) return;
      clearActive();
    }

    function onFocusIn(event) {
      var interactive = getInteractiveFromNode(event.target);
      if (interactive) setActiveInteractive(interactive);
    }

    function onFocusOut(event) {
      var next = event.relatedTarget;
      if (next && activeInteractive && activeInteractive.contains(next)) return;
      clearActive();
    }

    function onPress(event) {
      var interactive = getInteractiveFromNode(event.target);
      if (interactive) setActiveInteractive(interactive);
    }

    ensureStyle();

    document.addEventListener("mouseover", onMouseOver, true);
    document.addEventListener("mouseout", onMouseOut, true);
    document.addEventListener("focusin", onFocusIn, true);
    document.addEventListener("focusout", onFocusOut, true);
    document.addEventListener("pointerdown", onPress, true);
    document.addEventListener("touchstart", onPress, true);

    window[STATE_KEY] = {
      cleanup: function () {
        clearActive();
        document.removeEventListener("mouseover", onMouseOver, true);
        document.removeEventListener("mouseout", onMouseOut, true);
        document.removeEventListener("focusin", onFocusIn, true);
        document.removeEventListener("focusout", onFocusOut, true);
        document.removeEventListener("pointerdown", onPress, true);
        document.removeEventListener("touchstart", onPress, true);
        touchedTargets.forEach(function (target) {
          if (!target || !target.style) return;
          target.style.textDecoration = "";
          target.style.backgroundImage = "";
          target.style.backgroundRepeat = "";
          target.style.backgroundPosition = "";
          target.style.backgroundSize = "";
          target.style.opacity = "";
          target.style.transitionProperty = "";
          target.style.transitionDuration = "";
          target.style.transitionTimingFunction = "";
        });
        touchedTargets = [];
      }
    };
  })();
</script>
