<script>
  (function () {
    const STATE_KEY = "__hinsideBlinkCursorState";

    if (window[STATE_KEY] && typeof window[STATE_KEY].cleanup === "function") {
      window[STATE_KEY].cleanup();
    }

    const EYE_OPEN_CURSOR_DATA_URI = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="96" height="56" viewBox="0 0 96 56" fill="none">
        <path d="M64 48V56H32V48H64Z" fill="white"/>
        <path d="M32 48H16V40H32V48Z" fill="white"/>
        <path d="M80 48H64V40H80V48Z" fill="white"/>
        <path d="M16 40H8V32H16V40Z" fill="white"/>
        <path d="M88 40H80V32H88V40Z" fill="white"/>
        <path d="M56 36H40V20H56V36Z" fill="white"/>
        <path d="M8 32H0V24H8V32Z" fill="white"/>
        <path d="M96 32H88V24H96V32Z" fill="white"/>
        <path d="M16 24H8V16H16V24Z" fill="white"/>
        <path d="M88 24H80V16H88V24Z" fill="white"/>
        <path d="M32 16H16V8H32V16Z" fill="white"/>
        <path d="M80 16H64V8H80V16Z" fill="white"/>
        <path d="M64 8H32V0H64V8Z" fill="white"/>
      </svg>
    `)}`;
    const EYE_HALF_CURSOR_DATA_URI = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="96" height="24" viewBox="0 0 96 24" fill="none">
        <path d="M80 8H56V16H80V24H16V16H40V8H16V0H80V8Z" fill="white"/>
        <path d="M16 16H0V8H16V16Z" fill="white"/>
        <path d="M96 8V16H80V8H96Z" fill="white"/>
      </svg>
    `)}`;
    const EYE_CLOSED_CURSOR_DATA_URI = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="96" height="8" viewBox="0 0 96 8" fill="none">
        <path d="M96 0V8H0V0H96Z" fill="white"/>
      </svg>
    `)}`;

    const OPEN_CURSOR = `url("${EYE_OPEN_CURSOR_DATA_URI}") 48 28`;
    const HALF_CURSOR = `url("${EYE_HALF_CURSOR_DATA_URI}") 48 12`;
    const CLOSED_CURSOR = `url("${EYE_CLOSED_CURSOR_DATA_URI}") 48 4`;
    const CURSOR_FRAMES = [OPEN_CURSOR, HALF_CURSOR, CLOSED_CURSOR];

    const BLINK_SEQUENCE_SINGLE = [0, 1, 2, 1, 0];
    const BLINK_SEQUENCE_DOUBLE = [0, 1, 2, 1, 0, 1, 2, 1, 0];
    const BLINK_TIMINGS_MS = [0, 120, 185, 250, 330, 410, 475, 540, 620];
    const BLINK_DOUBLE_PROBABILITY = 0.32;
    const BLINK_NEXT_DELAY_MIN_MS = 2600;
    const BLINK_NEXT_DELAY_RANGE_MS = 2800;

    let style = document.getElementById("hinside-eye-cursor-style");
    if (!style) {
      style = document.createElement("style");
      style.id = "hinside-eye-cursor-style";
      document.head.appendChild(style);
    }

    style.textContent = `
      @media (pointer: fine) and (hover: hover) {
        /*
          Disable Figma Sites' fake cursor overlay, if it exists.
          We are using the browser's native cursor system instead.
        */
        #sites-cursor-element {
          display: none !important;
          visibility: hidden !important;
        }

        /*
          Target clickable image wrappers generated by Figma Sites.
          Hotspot is centered: 96 / 2 = 48, 56 / 2 = 28.
        */
        .code-behavior-wrapper [role="button"],
        .code-behavior-wrapper .cursor-pointer,
        .cursor-pointer {
          cursor: var(--hinside-eye-cursor), pointer !important;
        }
      }
    `;

    function setCursor(cursorValue) {
      document.documentElement.style.setProperty("--hinside-eye-cursor", cursorValue);
    }

    const timers = [];

    function queue(fn, delayMs) {
      const id = window.setTimeout(fn, delayMs);
      timers.push(id);
      return id;
    }

    function clearTimers() {
      while (timers.length) {
        window.clearTimeout(timers.pop());
      }
    }

    function applyFrame(frameIndex) {
      const frame = CURSOR_FRAMES[frameIndex] || CURSOR_FRAMES[0];
      setCursor(frame);
    }

    function scheduleBlink() {
      clearTimers();
      const sequence = Math.random() < BLINK_DOUBLE_PROBABILITY
        ? BLINK_SEQUENCE_DOUBLE
        : BLINK_SEQUENCE_SINGLE;

      function step(index) {
        applyFrame(sequence[index]);

        if (index < sequence.length - 1) {
          const delayMs = BLINK_TIMINGS_MS[index + 1] - BLINK_TIMINGS_MS[index];
          queue(function () {
            step(index + 1);
          }, delayMs);
          return;
        }

        const nextBlinkDelay = BLINK_NEXT_DELAY_MIN_MS + Math.random() * BLINK_NEXT_DELAY_RANGE_MS;
        queue(function () {
          scheduleBlink();
        }, nextBlinkDelay);
      }

      step(0);
    }

    setCursor(OPEN_CURSOR);
    scheduleBlink();

    window[STATE_KEY] = {
      cleanup: function () {
        clearTimers();
        setCursor(OPEN_CURSOR);
      }
    };
  })();
</script>
